name: Build and deploy the book to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Permissions required for the official GitHub Pages deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; newer pushes cancel older in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build dependency (only `markdown` is needed to render the chapters)
        run: python -m pip install --upgrade pip markdown

      - name: Build the static site from the Markdown chapters
        run: python book/code/_build_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the built site as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4